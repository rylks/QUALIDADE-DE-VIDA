<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  body{width:320px;margin:0;padding:12px;font:13px system-ui,sans-serif;background:#0d0b19;color:#eee}
  label{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:8px}
  textarea{width:100%;box-sizing:border-box;height:90px;padding:6px;background:#1b1830;color:#fff;border:1px solid #444;border-radius:4px;font:12px monospace;resize:vertical}
  input[type=number]{width:70px;padding:3px;background:#1b1830;color:#fff;border:1px solid #444;border-radius:4px}
  .chk{justify-content:flex-start}
  button{width:100%;padding:8px;margin-top:8px;border:0;border-radius:6px;font-weight:700;cursor:pointer;background:#f5c400;color:#111}
  button.on{background:#2ecc71}
  button.sec{background:#2a2650;color:#eee}
  #status{margin-top:8px;font-size:12px;color:#ccc;min-height:30px}
  #summary{margin-top:4px;font-size:11px;color:#888;word-break:break-word}
  small{color:#888}
</style></head><body>
  <small>Links ou nomes das lives (um por linha):</small>
  <textarea id="livesText" placeholder="https://www.twitch.tv/flavinnbr&#10;belky"></textarea>
  <label>Reiniciou quando zona ≤ <input id="resetZone" type="number" min="1"></label>
  <label>Intervalo mín. entre buscas (s) <input id="scanGapSec" type="number" min="30"></label>
  <label class="chk"><input id="autoJogar" type="checkbox"> Digitar $jogar na live de maior zona</label>
  <button id="toggle">Ligar</button>
  <button id="scanNow" class="sec">Procurar agora</button>
  <div id="status"></div>
  <div id="summary"></div>
  <script src="popup.js"></script>
</body></html>
